<link href="https://fonts.googleapis.com/css2?family=Oleo+Script&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#000;}
:root{--bg:#0D1117;--sf:#161C24;--s2:#1A2410;--gr:#00FF7F;--gd:#00994C;--rd:#FF4444;--yw:#F5E642;--or:#FF8C00;--wh:#E8EEE8;--mu:#5A6A5A;--pk:#FF4D8C;--mo:'Courier New',monospace;--sa:-apple-system,'Helvetica Neue',Arial,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
.app-viewport-lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,0.8);width:100vw;height:100dvh;}
header{border-bottom:1px solid #1E2A1E;padding:4px 10px;padding-top:calc(4px + var(--st));display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:44px;}
.logo-main{font-family:'Oleo Script',cursive;font-size:18px;color:var(--pk);}
.logo-ver{font-size:9px;color:var(--pk);margin-left:5px;}
#view-training{display:flex;flex-direction:column;flex:1;overflow:hidden;}
.board-wrap svg{width:100%;height:100%;touch-action:manipulation;}
.btn{padding:12px;border-radius:7px;border:none;font-weight:700;cursor:pointer;}
.btn-primary{background:var(--gr);color:#0D1117;}

</head>

</html>
