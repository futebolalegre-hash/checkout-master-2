<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CheckoutMaster">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D1117">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./icon.jpg">
<link rel="icon" type="image/jpeg" href="./icon.jpg">
<title>Checkout Master for Puku Freaks</title>
<link href="https://fonts.googleapis.com/css2?family=Oleo+Script&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#000;}

:root{
  --bg:#0D1117;--sf:#161C24;--s2:#1A2410;
  --gr:#00FF7F;--gd:#00994C;--rd:#FF4444;
  --yw:#F5E642;--or:#FF8C00;--wh:#E8EEE8;--mu:#5A6A5A;
  --pk:#FF4D8C;--mo:'Courier New',monospace;
  --sa:-apple-system,'Helvetica Neue',Arial,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}

.app-viewport-lock {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
}

@media (min-aspect-ratio: 9/19.5) {
  .app-viewport-lock {
    height: 100dvh;
    height: 100vh;
    width: calc(100dvh * (9 / 19.5));
    width: calc(100vh * (9 / 19.5));
  }
}

@media (max-aspect-ratio: 9/19.5) {
  .app-viewport-lock {
    width: 100vw;
    height: calc(100vw * (19.5 / 9));
  }
}

header{border-bottom:1px solid #1E2A1E;padding:4px 10px;padding-top:calc(4px + var(--st));display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:44px;}
.logo{display:flex;flex-direction:column;justify-content:center;cursor:pointer;}
.logo-top{display:flex;align-items:baseline;gap:5px;}
.logo-main{font-family:'Oleo Script',cursive;font-size:18px;letter-spacing:0.5px;color:var(--pk);text-shadow:0 0 12px rgba(255,77,140,0.5), 0 2px 4px rgba(0,0,0,0.8);line-height:1;}
.logo-sub{font-family:'Oleo Script',cursive;font-size:11px;letter-spacing:0.5px;color:var(--pk);text-shadow:0 0 12px rgba(255,77,140,0.5), 0 2px 4px rgba(0,0,0,0.8);line-height:1;margin-top:2px;}
.logo-ver{font-family:'Impact','Arial Black','Helvetica Neue',sans-serif;font-size:9px;font-weight:900;letter-spacing:1px;color:var(--pk);text-shadow:0 0 12px rgba(255,77,140,0.5), 0 2px 4px rgba(0,0,0,0.8);line-height:1;}
.nav-tabs{display:flex;gap:4px;align-items:center;}
.nav-tab{background:none;border:1px solid transparent;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:1px;padding:4px 10px;cursor:pointer;border-radius:5px;transition:all .15s;font-family:var(--sa);}
.nav-tab.active{border-color:var(--gd);color:var(--gr);background:rgba(0,255,127,.08);}

#view-training{display:none;flex-direction:column;flex:1;padding:4px 8px;overflow:hidden;}
#view-training.active{display:flex;}
.view{display:none;padding:12px 14px;flex:1;overflow-y:auto;overflow-x:hidden;}
.view.active{display:block;}

.top-controls{flex-shrink:0;}
.stats-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:5px;}
.stat-box{background:var(--sf);border:1px solid #1E2A1E;border-radius:7px;padding:5px 4px;text-align:center;}
.stat-val{font-family:var(--mo);font-size:20px;font-weight:bold;color:var(--yw);display:block;}
.stat-lbl{font-size:11px;font-weight:600;color:var(--mu);letter-spacing:1px;display:block;margin-top:1px;}
.ctrl-row{display:flex;gap:5px;margin-bottom:5px;}
.ctrl-btn{flex:1;padding:6px 2px;border-radius:6px;border:1px solid #2A3A2A;background:none;color:var(--mu);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;font-family:var(--sa);text-align:center;line-height:1.3;}
.ctrl-btn.active{border-color:var(--gd);color:var(--gr);background:rgba(0,255,127,.08);}
.ctrl-btn .ci{display:block;font-size:15px;margin-bottom:1px;}
.settings-row{display:flex;flex-direction:column;gap:3px;margin-bottom:3px;}
.settings-line{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;justify-content:space-between;}
.sg{display:flex;gap:3px;align-items:center;}
.slbl{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:1px;white-space:nowrap;margin-right:2px;}
.pill{padding:4px 6px;border-radius:4px;border:1px solid #2A3A2A;background:none;color:var(--mu);font-size:11px;font-weight:600;cursor:pointer;transition:all .12s;font-family:var(--sa);white-space:nowrap;}
.pill.active{border-color:var(--gd);color:var(--gr);background:rgba(0,255,127,.08);}
.vsep{width:1px;background:#2A3A2A;align-self:stretch;margin:0 3px;}
.timer-area{flex-shrink:0;margin-bottom:4px;display:none;}
.timer-top{display:flex;align-items:baseline;justify-content:center;gap:5px;}
.timer-num{font-family:var(--mo);font-size:30px;font-weight:bold;color:var(--pk);}
.timer-num.danger{color:var(--rd);animation:pulse .5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.timer-lbl{font-size:13px;color:var(--mu);}
.timer-bar{height:4px;background:var(--s2);border-radius:2px;overflow:hidden;margin-top:2px;}
.timer-fill{height:100%;background:var(--pk);transition:width .1s linear;border-radius:2px;}
.timer-fill.danger{background:var(--rd);}

.board-area{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-badge{font-family:var(--mo);font-size:36px;font-weight:bold;color:var(--yw);line-height:1;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:6px;}
.score-sub{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--mu);text-align:center;margin:0;flex-shrink:0;}
.board-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:0 4px;}

.board-wrap svg{width:100%;height:100%;max-width:480px;max-height:480px;display:block;overflow:visible;filter:drop-shadow(0 3px 14px rgba(0,0,0,.85));touch-action:manipulation;}
@keyframes segFlash{0%{opacity:1}40%{opacity:.15}100%{opacity:1}}
.seg-flash{animation:segFlash .2s ease-out;}

.ta-result{display:none;flex-direction:column;align-items:center;justify-content:flex-start;flex:1;text-align:center;gap:10px; padding:10px 0 20px 0; overflow-y:auto; width:100%;}
.ta-result.show{display:flex;}
.ta-score-big{font-family:var(--mo);font-size:72px;font-weight:bold;color:var(--yw);line-height:1;}
.ta-lbl{font-size:13px;font-weight:600;letter-spacing:3px;color:var(--mu);}
.ta-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;width:100%;max-width:320px;}
.ta-cell{background:var(--sf);border:1px solid #1E2A1E;border-radius:7px;padding:8px;}
.ta-cv{font-family:var(--mo);font-size:22px;font-weight:bold;display:block;}
.ta-cl{font-size:10px;font-weight:700;color:var(--mu);letter-spacing:1px;}

.bottom-panel{flex-shrink:0;}
.darts-indicator{display:flex;justify-content:center;gap:10px;margin-bottom:3px;height:30px;}
.pink-dart{width:12px;height:32px;transition:all .2s ease;}
.pink-dart.used{transform:scale(0.8) translateY(-5px);opacity:0.25;filter:grayscale(100%);}

.throw-counter{text-align:center;font-size:12px;font-weight:600;color:var(--mu);letter-spacing:1px;margin-bottom:3px;}
.throw-log{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:24px;margin-bottom:4px;}
.tchip{background:var(--s2);border:1px solid #2A3A2A;border-radius:4px;padding:3px 8px;font-family:var(--mo);font-size:12px;font-weight:bold;color:var(--wh);display:flex;align-items:center;gap:3px;}
.tchip.hit{border-color:var(--gd);color:var(--gr);}
.tchip.miss{border-color:var(--rd);color:var(--rd);}
.tchip.partial{border-color:var(--or);color:var(--or);}

.result-banner{border-radius:6px;padding:7px 11px;font-size:12px;font-weight:600;margin-bottom:4px;display:none;align-items:flex-start;gap:7px;}
.result-banner.show{display:flex;}
.result-banner.correct{background:rgba(0,255,127,.1);border:1px solid var(--gd);color:var(--gr);}
.result-banner.wrong{background:rgba(255,68,68,.08);border:1px solid #662222;color:var(--rd);}
.result-banner.partial{background:rgba(255,140,0,.08);border:1px solid #885500;color:var(--or);}

.theory-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:3px;user-select:none;}
.theory-toggle input{accent-color:var(--gr);width:14px;height:14px;cursor:pointer;}
.theory-panel{background:#0F1A0F;border:1px solid #1E3A1E;border-radius:6px;padding:6px 8px;margin-bottom:4px;font-size:11.5px;line-height:1.5;color:#8AB890;display:none;max-height:85px;overflow-y:auto;}
.theory-panel.show{display:block;}
.tpt{font-size:9px;font-weight:700;letter-spacing:3px;color:var(--gd);margin-bottom:3px;display:flex;align-items:center;gap:4px;}
.tpt::before{content:'';display:inline-block;width:5px;height:5px;background:var(--gd);border-radius:50%;}
.tsec strong{color:var(--wh);font-family:var(--mo);font-size:11.5px;}
.order-note{background:rgba(255,140,0,.07);border-left:2px solid #885500;padding:4px 8px;border-radius:0 3px 3px 0;margin-top:4px;font-size:11px;color:#DDAA66;}

.btn-row{display:flex;gap:7px;}
.btn{flex:1;padding:11px;border-radius:7px;border:none;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:var(--sa);transition:all .12s;}
.btn-primary{background:var(--gr);color:#0D1117;}
.btn-secondary{background:var(--s2);color:var(--mu);border:1px solid #2A3A2A;}
.btn-orange{background:var(--or);color:#0D1117;}
.btn-pink{background:var(--pk);color:#0D1117;}

.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.filter-chip{background:none;border:1px solid #2A3A2A;color:var(--mu);font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;letter-spacing:1px;}
.filter-chip.active{border-color:var(--gd);color:var(--gr);background:rgba(0,255,127,.08);}
.arr-table{display:flex;flex-direction:column;gap:4px;}
.arr-row{background:var(--sf);border:1px solid #1E2A1E;border-radius:7px;padding:10px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .12s;}
.arr-row:hover{border-color:var(--gd);}
.ar-s{font-family:var(--mo);font-size:19px;font-weight:bold;color:var(--yw);width:36px;text-align:right;flex-shrink:0;}
.ar-t{flex:1;font-size:13px;font-weight:600;color:var(--wh);}
.ar-t small{color:var(--mu);font-size:11px;display:block;margin-top:2px;line-height:1.4;}
.ar-tag{font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 5px;border-radius:3px;background:var(--s2);color:var(--mu);flex-shrink:0;}
.ar-tag.bull{background:rgba(245,230,66,.1);color:var(--yw);}
.ar-tag.double{background:rgba(0,255,127,.07);color:var(--gd);}
.ar-tag.key{background:rgba(255,140,0,.12);color:var(--or);}
.arr-det{display:none;background:#0F1A0F;border:1px solid #1E3A1E;border-top:none;padding:10px 13px;font-size:12px;color:#8AB890;line-height:1.8;border-radius:0 0 7px 7px;}
.arr-det.open{display:block;}

.hist-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.hist-ttl{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--mu);}
.clr-btn{background:none;border:1px solid #2A3A2A;color:var(--mu);font-size:12px;font-weight:600;padding:5px 11px;border-radius:5px;cursor:pointer;}
.clr-btn:hover{color:var(--rd);border-color:#662222;}
.hist-list{display:flex;flex-direction:column;gap:5px;}
.hist-item{background:var(--sf);border:1px solid #1E2A1E;border-radius:7px;padding:9px 13px;display:flex;align-items:center;gap:10px;}
.hi-s{font-family:var(--mo);font-size:19px;font-weight:bold;color:var(--yw);width:40px;flex-shrink:0;}
.hi-a{flex:1;font-size:13px;font-weight:600;color:var(--wh);}
.hi-a small{color:var(--mu);font-size:11px;display:block;}
.hi-r{font-size:11px;font-weight:900;padding:3px 8px;border-radius:4px;flex-shrink:0;text-align:center;width:24px;}
.hi-r.exc{background:rgba(0,255,127,.15);color:var(--gr);}
.hi-r.good{background:rgba(245,230,66,.15);color:var(--yw);}
.hi-r.par{background:rgba(255,140,0,.15);color:var(--or);}
.hi-r.miss{background:rgba(255,68,68,.15);color:var(--rd);}

.empty-state{text-align:center;padding:40px 20px;color:var(--mu);font-size:13px;line-height:2.2;}
.install-banner{background:var(--sf);border-top:1px solid #1E2A1E;padding:8px 14px;padding-bottom:calc(8px + var(--sb));display:none;align-items:center;gap:9px;flex-shrink:0;}
.install-banner.show{display:flex;}
.install-txt{flex:1;font-size:12px;font-weight:600;color:var(--mu);line-height:1.5;}
.install-txt b{color:var(--wh);}
.install-btn{background:var(--gr);color:#0D1117;border:none;border-radius:6px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;}
.install-close{background:none;border:none;color:var(--mu);cursor:pointer;font-size:18px;padding:2px 5px;}
</style>
</head>
<body>

<div class="app-viewport-lock">
  <div style="display:none;">
      <audio id="bgm-upbeat" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
      <audio id="bgm-cyber" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"></audio>
      <audio id="bgm-calm" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3"></audio>
      <audio id="bgm-ending" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3"></audio>
  </div>
  <header>
    <div class="logo" onclick="resetToHome()">
      <div class="logo-top"><span class="logo-main">Checkout Master</span><span class="logo-ver">ver.1.06</span></div>
      <span class="logo-sub">for Puku Freaks</span>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" onclick="switchView('training',this)">練習</button>
      <button class="nav-tab" onclick="switchView('table',this)">表</button>
      <button class="nav-tab" onclick="switchView('history',this)">履歴</button>
    </nav>
  </header>
  <div id="view-training" class="active">
    <div class="top-controls">
      <div class="stats-bar">
        <div class="stat-box"><span class="stat-val" id="stat-total">0</span><span class="stat-lbl">TOTAL</span></div>
        <div class="stat-box"><span class="stat-val" id="stat-correct">0</span><span class="stat-lbl">CORRECT</span></div>
        <div class="stat-box"><span class="stat-val" id="stat-rate">—</span><span class="stat-lbl">RATE</span></div>
      </div>
      <div class="ctrl-row">
        <button class="ctrl-btn active" onclick="setMode(this,'quiz')"><span class="ci">🎯</span>QUIZ</button>
        <button class="ctrl-btn" onclick="setMode(this,'timeattack')"><span class="ci">⏱</span>TIME ATTACK</button>
        <button class="ctrl-btn" onclick="setMode(this,'study')"><span class="ci">📖</span>STUDY</button>
        <button class="ctrl-btn" onclick="setMode(this,'weak')"><span class="ci">🔥</span>苦手TOP10</button>
      </div>
      <div class="settings-row">
        <div class="settings-line">
          <div style="display:flex; gap:5px;">
            <div class="sg"><span class="slbl">OUT</span>
              <button class="pill active" id="out-double" onclick="setOutMode(this,'double')">DBL</button>
              <button class="pill"        id="out-master" onclick="setOutMode(this,'master')">MAS</button>
              <button class="pill"        id="out-open"   onclick="setOutMode(this,'open')">OPN</button>
            </div>
            <div class="vsep"></div>
            <div class="sg"><span class="slbl">BULL</span>
              <button class="pill active" id="bull-fat" onclick="setBull(this,'fat')">FAT</button>
              <button class="pill"        id="bull-sep" onclick="setBull(this,'sep')">SEP</button>
            </div>
          </div>
          <div class="sg" style="gap:2px;">
            <label style="display:flex;align-items:center;cursor:pointer;"><input type="checkbox" id="sound-toggle" checked onchange="toggleSound(this.checked)" style="accent-color:var(--gr);width:12px;height:12px;"><span style="font-size:12px;margin-left:1px;">🔊</span></label>
            <label style="display:flex;align-items:center;cursor:pointer;"><input type="checkbox" id="bgm-toggle" checked onchange="toggleBGM(this.checked)" style="accent-color:var(--gr);width:12px;height:12px;"><span style="font-size:12px;margin-left:1px;">🎵</span></label>
            <select id="bgm-select" onchange="changeBGM()" style="background:var(--s2); border:1px solid #2A3A2A; color:var(--wh); font-family:var(--sa); font-size:10px; font-weight:600; border-radius:4px; padding:0; cursor:pointer; outline:none; height:18px;">
              <option value="bgm-upbeat">TRK1</option>
              <option value="bgm-cyber">TRK2</option>
              <option value="bgm-calm">TRK3</option>
            </select>
          </div>
        </div>
        <div class="settings-line">
          <div class="sg" id="ta-time-group" style="display:none"><span class="slbl">SEC</span>
            <button class="pill active" id="ta15" onclick="setTATime(this,15)">15</button>
            <button class="pill"        id="ta30" onclick="setTATime(this,30)">30</button>
            <button class="pill"        id="ta60" onclick="setTATime(this,60)">60</button>
          </div>
          <div class="vsep" id="ta-vsep" style="display:none"></div>
          <div class="sg" id="level-group"><span class="slbl">LV</span>
            <button class="pill active" onclick="setLevel(this,'easy')">E</button>
            <button class="pill"        onclick="setLevel(this,'normal')">N</button>
            <button class="pill"        onclick="setLevel(this,'hard')">H</button>
            <button class="pill"        onclick="setLevel(this,'setup')">S</button>
          </div>
        </div>
      </div>
    </div>
    <div class="timer-area" id="ta-timer-area">
      <div class="timer-top"><span class="timer-num" id="timer-display">15</span><span class="timer-lbl">sec</span></div>
      <div class="timer-bar"><div class="timer-fill" id="timer-bar" style="width:100%"></div></div>
    </div>
    <div id="weak-panel" style="display:none;flex-shrink:0;">
      <div style="background:rgba(255,77,140,0.08);border:1px solid rgba(255,77,140,0.3);border-radius:8px;padding:8px 12px;margin-bottom:5px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:12px;font-weight:700;color:var(--pk);letter-spacing:2px;">🔥 苦手 TOP10 モード</span>
          <span id="weak-progress" style="font-size:11px;color:var(--mu);font-family:var(--mo);">0/10</span>
        </div>
        <div id="weak-list" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
      </div>
    </div>
    <div id="weak-empty" style="display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px;">
      <div style="font-size:36px;">📊</div>
      <div style="font-size:15px;font-weight:700;color:var(--wh);">データが足りません</div>
      <div style="font-size:12px;color:var(--mu);line-height:1.8;">QUIZモードで<strong style="color:var(--wh);">10問以上</strong>誤回答する必要があります。</div>
      <button class="btn btn-primary" onclick="setMode(document.querySelectorAll('.ctrl-btn')[0],'quiz')" style="width:140px;margin-top:4px;">QUIZ を始める</button>
    </div>
    <div class="board-area" id="board-area">
      <div style="display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:2px;flex-shrink:0;">
        <div class="score-sub">LEFT</div>
        <div class="score-badge" id="current-score">—</div>
      </div>
      <div class="board-wrap"><svg id="dartboard" viewBox="-30 -30 460 460" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
    <div class="ta-result" id="ta-result">
      <div style="flex-shrink:0;width:100%;display:flex;flex-direction:column;align-items:center;">
        <div id="ta-rank-badge" style="font-size:28px;font-weight:900;letter-spacing:2px;margin-bottom:2px;"></div>
        <div id="ta-rank-label" style="font-size:12px;color:var(--mu);letter-spacing:2px;margin-bottom:8px;">ARRANGE RANK</div>

function mapCustomArrange(str){if(!str)return[];let s=str.replace(/Outer Bull/gi,'S25').replace(/Inner Bull/gi,'Bull').replace(/DB/gi,'Bull').replace(/SB/gi,'S25');return s.split(/\s+/).filter(x=>x);}
function getRawPool(){let pool=[];const bull=ST.bullMode==='sep'?1:0;const out=ST.outMode==='open'?0:(ST.outMode==='double'?1:2);const stdSuffix=`_${bull}_${out}`;const bogeys=[169,168,166,165,163,162,159];Object.keys(window.CUSTOM_DB).forEach(k=>{if(k.endsWith(stdSuffix)){let s=parseInt(k.split('_')[0]);if(out===1&&s<=180&&bogeys.includes(s))return;const t=mapCustomArrange(window.CUSTOM_DB[k].a);if(t.length>0)pool.push({score:s,throws:t,theory:window.CUSTOM_DB[k].m});}});pool.sort((a,b)=>b.score-a.score);return pool;}
function _buildQueue(){let pool=getRawPool();if(ST.mode==='weak'&&ST._weakPool){pool=ST._weakPool.filter(a=>!ST._weakAnswered.has(a.score));if(pool.length===0)pool=ST._weakPool;}else{if(ST.level==='easy')pool=pool.filter(a=>a.score<=60);else if(ST.level==='normal')pool=pool.filter(a=>a.score>=61&&a.score<=110);else if(ST.level==='hard')pool=pool.filter(a=>a.score>=111&&a.score<=180);else if(ST.level==='setup')pool=pool.filter(a=>a.score>=181);}const arr=[...pool];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}ST._queue=arr;}
function _pickNext(){if(ST._queue.length===0)_buildQueue();if(ST._queue.length===0)return null;if(ST._queue.length>1&&ST._queue[0].score===ST._lastScore)ST._queue.push(ST._queue.shift());const q=ST._queue.shift();ST._lastScore=q.score;return q;}
function normBull(seg){if(ST.bullMode==='fat'&&seg==='S25')return'Bull';return seg;}
function checkOrder(input,correct){if(!correct||input.length!==correct.length)return false;const si=[...input].sort().join(','),sc=[...correct].sort().join(',');return si===sc&&JSON.stringify(input)!==JSON.stringify(correct);}
function resetToHome(){if(ST.ta.timer){clearInterval(ST.ta.timer);ST.ta.timer=null;}ST.ta.active=false;BGM.stop();ST._queue=[];ST._lastScore=null;setMode(document.querySelectorAll('.ctrl-btn')[0],'quiz');}
function onTap(label,val,e){if(ST.answered)return;if(ST.mode==='timeattack'&&!ST.ta.active)return;if(ST.input.length>=3)return;const n=normBull(label);SND.play(label);flashSeg(label);if(e){const svg=document.getElementById('dartboard');const pt=getSvgCoords(svg,e);const dx=pt.x-CX,dy=pt.y-CY;const r_click=Math.sqrt(dx*dx+dy*dy);let r=0;let angle=0;if(label==='Bull'){r=0;angle=0;}else if(label==='S25'){r=37.5;angle=Math.atan2(dy,dx)*180/Math.PI+90;}else{const num=parseInt(label.slice(1),10);const idx=SECTORS.indexOf(num);angle=idx*18;if(label.startsWith('D'))r=177;else if(label.startsWith('T'))r=116;else{if(r_click>100)r=146;else r=75;}}const rad=(angle-90)*Math.PI/180;const baseX=CX+r*Math.cos(rad);const baseY=CY+r*Math.sin(rad);const targetId=label+(label.startsWith('S')&&label!=='S25'?(r_click>100?'_o':'_i'):'');const count=document.querySelectorAll(`.thrown-dart[data-target="${targetId}"]`).length;let ox=0,oy=0;if(r===0){if(count===1){ox=-8;oy=8;}if(count===2){ox=8;oy=-8;}}else{const tx=-Math.sin(rad);const ty=Math.cos(rad);const shift=count===1?12:count===2?-12:0;ox=shift*tx;oy=shift*ty;}drawDart(baseX+ox,baseY+oy,targetId);}ST.input.push(n);renderLog();}
function segVal(label){if(label==='Bull')return 50;if(label==='S25')return 25;if(label.startsWith('T'))return parseInt(label.slice(1),10)*3;if(label.startsWith('D'))return parseInt(label.slice(1),10)*2;if(label.startsWith('S'))return parseInt(label.slice(1),10);return 0;}
function isMathOut(input,targetScore,outMode){let sum=0;for(let i=0;i<input.length;i++){let val=segVal(input[i]);sum+=val;if(i<input.length-1&&sum>=targetScore)return false;}if(sum!==targetScore)return false;let lastDart=input[input.length-1];let isDouble=lastDart.startsWith('D')||lastDart==='Bull';let isTriple=lastDart.startsWith('T');if(outMode==='double')return isDouble;else if(outMode==='master')return isDouble||isTriple;else return true;}
function renderLog(evalClass,msgExt){const q=ST.current,throws=q?q.throws:[];const log=document.getElementById('throw-log'),ctr=document.getElementById('throw-counter');const scoreEl=document.getElementById('current-score');const maxT=3;const rem=maxT-ST.input.length;if(q){let sum=0;ST.input.forEach(seg=>sum+=segVal(seg));if(ST.showRemain&&ST.input.length>0){let remScore=q.score-sum;let color='var(--gr)';if(remScore<0||(ST.outMode!=='open'&&remScore===1)){color='var(--rd)';}else if(remScore===0){const last=ST.input[ST.input.length-1];if(ST.outMode==='double'&&!(last.startsWith('D')||last==='Bull'))color='var(--rd)';else if(ST.outMode==='master'&&!(last.startsWith('D')||last.startsWith('T')||last==='Bull'))color='var(--rd)';else color='var(--yw)';}scoreEl.innerHTML=`${q.score} <span style="font-size:24px;color:${color};">→ ${remScore}</span>`;}else{scoreEl.textContent=q.score;}}else{scoreEl.textContent="—";}const indicator=document.getElementById('darts-indicator');if(indicator){if(document.getElementById('ta-result').classList.contains('show')){indicator.style.display='none';}else{indicator.style.display='flex';let dh='';for(let i=0;i<maxT;i++){const usedClass=(i<ST.input.length)?'used':'';dh+=`<svg class="pink-dart ${usedClass}" viewBox="0 0 20 60"><path d="M10,16 L2,4 L6,0 L10,5 L14,0 L18,4 Z" fill="var(--pk)" stroke="#111" stroke-width="0.5"/><path d="M10,16 L10,5 L14,0 L18,4 Z" fill="rgba(0,0,0,0.15)"/><rect x="8.5" y="15" width="3" height="18" fill="#ddd" stroke="#999" stroke-width="0.5"/><path d="M7,32 C7,30 13,30 13,32 L12,48 C12,50 8,50 8,48 Z" fill="#aaa" stroke="#555" stroke-width="0.5"/><line x1="7.5" y1="36" x2="12.5" y2="36" stroke="#555" stroke-width="1"/><line x1="7.5" y1="40" x2="12.5" y2="40" stroke="#555" stroke-width="1"/><line x1="7.8" y1="44" x2="12.2" y2="44" stroke="#555" stroke-width="1"/><path d="M9,49 L11,49 L10,60 Z" fill="#444"/></svg>`;}indicator.innerHTML=dh;}}const cls_func=(t,i)=>{if(!ST.answered)return'tchip';if(evalClass==='exc'||evalClass==='good')return'tchip hit';if(checkOrder(ST.input,throws))return'tchip partial';return'tchip miss';};log.innerHTML=ST.input.map((t,i)=>{const cls=cls_func(t,i);return`<div class="${cls}"><span>${t}</span>${!ST.answered?`<span class="del" onclick="rmThrow(${i})">✕</span>`:''}</div>`;}).join('');if(!ST.answered){ctr.textContent=rem>0?`あと${rem}本スロー（確定ボタンで完了）`:'（確定ボタンで完了）';}else{ctr.textContent='';}const confirmBtn=document.getElementById('confirm-btn-row');const mainBtns=document.getElementById('main-btns');if(!ST.answered&&ST.input.length>0){if(confirmBtn)confirmBtn.style.display='flex';if(mainBtns)mainBtns.style.display='none';}else{if(confirmBtn)confirmBtn.style.display='none';if(ST.mode==='timeattack'){if(!ST.ta.active){if(mainBtns)mainBtns.style.display='none';document.getElementById('ta-start-btn').style.display='flex';document.getElementById('ta-playing-btn').style.display='none';}else{if(mainBtns)mainBtns.style.display='none';document.getElementById('ta-start-btn').style.display='none';document.getElementById('ta-playing-btn').style.display='flex';}}else if(ST.mode==='weak'&&!ST.answered){if(mainBtns)mainBtns.style.display='none';document.getElementById('ta-start-btn').style.display='none';document.getElementById('ta-playing-btn').style.display='none';}else{if(mainBtns)mainBtns.style.display='flex';document.getElementById('ta-start-btn').style.display='none';document.getElementById('ta-playing-btn').style.display='none';}}}
function rmThrow(i){if(ST.answered)return;ST.input.splice(i,1);const darts=document.querySelectorAll('.thrown-dart');if(darts.length>i)darts[i].remove();renderLog();}
function checkAnswer(){if(!ST.current||ST.answered)return;ST.answered=true;const q=ST.current,correct=q.throws,input=ST.input;const exactOk=JSON.stringify(input)===JSON.stringify(correct);const mathOk=isMathOut(input,q.score,ST.outMode);let evaluation='miss';let msgExt="";if(exactOk){evaluation='exc';msgExt="最優秀アレンジ";}else if(mathOk){if(input.length<correct.length){evaluation='exc';msgExt="ショートカット成立！";}else if(input.length===correct.length){evaluation='good';msgExt="ナイスアレンジ(別解)！";}else{evaluation='par';msgExt="イレギュラー上がり(手数が多め)";}}else if(correct.length>0&&checkOrder(input,correct)){evaluation='par';msgExt="上がり目残し(順序違い)";}else{evaluation='miss';}clearHL();if(evaluation==='exc'||evaluation==='good'){input.forEach(s=>hlSeg(s,PHX.sel_ok));SND.ok();}else if(evaluation==='par'){if(mathOk)input.forEach(s=>hlSeg(s,PHX.sel_or));else correct.forEach(s=>hlSeg(s,PHX.sel_or));SND.ng();}else{if(correct.length>0)correct.forEach(s=>hlSeg(s,PHX.sel_ok));input.forEach((s,i)=>{if(correct.length===0||s!==correct[i])hlSeg(s,PHX.sel_ng);});SND.ng();}if(ST.mode==='timeattack'){ST.ta.total++;if(evaluation!=='miss')ST.ta.correct++;ST.ta.history.push({score:q.score,input:[...input],correct:[...correct],eval:evaluation,theory:q.theory,timeout:false});renderLog(evaluation,msgExt);setTimeout(()=>{clearHL();if(ST.ta.active){ST.input=[];nextQuestion();}},800);return;}ST.stats.total++;if(evaluation!=='miss')ST.stats.correct++;if(ST.mode==='weak'&&(evaluation==='exc'||evaluation==='good'))markWeakAnswered(q.score,true);const ban=document.getElementById('result-banner');if(evaluation==='exc'){ban.className='result-banner show correct';document.getElementById('result-icon').textContent='◎';document.getElementById('result-text').textContent=`Perfect! [${msgExt}] `;}else if(evaluation==='good'){ban.className='result-banner show correct';document.getElementById('result-icon').textContent='◯';document.getElementById('result-text').textContent=`Nice! [${msgExt}] `;}else if(evaluation==='par'){ban.className='result-banner show partial';document.getElementById('result-icon').textContent='△';document.getElementById('result-text').textContent=`Partial: [${msgExt}] 正解例：${correct.join(' → ')}`;}else{ban.className='result-banner show wrong';document.getElementById('result-icon').textContent='✗';const cMsg=correct.length>0?correct.join(' → '):"上がり目なし";document.getElementById('result-text').textContent='Miss: 正解例：'+cMsg;}renderLog(evaluation,msgExt);renderTheory(q,evaluation==='par',msgExt);document.getElementById('theory-panel').classList.add('show');updateStats();document.getElementById('btn-hint').style.display='none';saveHist({type:`quiz_${evaluation}`,score:q.score,throws:correct.length>0?correct.join(' → '):"なし",ts:Date.now()});}

function tick(){ST.ta.timeLeft-=0.1;if(ST.ta.timeLeft<0)ST.ta.timeLeft=0;const el=document.getElementById('timer-display'),bar=document.getElementById('timer-bar');el.textContent=Math.ceil(ST.ta.timeLeft);el.className='timer-num'+(ST.ta.timeLeft<=5?' danger':'');bar.style.width=(ST.ta.timeLeft/ST.ta.totalTime*100)+'%';bar.className='timer-fill'+(ST.ta.timeLeft<=5?' danger':'');if(ST.ta.timeLeft<=0&&ST.ta.active){ST.ta.active=false;clearInterval(ST.ta.timer);ST.ta.timer=null;BGM.stop();SND.boom();setTimeout(()=>{BGM.playEnding();},1200);if(ST.current&&!ST.answered){ST.ta.total++;ST.ta.history.push({score:ST.current.score,input:[...ST.input],correct:ST.current.throws,eval:'miss',theory:ST.current.theory,timeout:true});}setTimeout(showTAResult,800);}}
function calcTARank(history,timeLimit,level){let scoreBase=0;let counts={exc:0,good:0,par:0,miss:0};history.forEach(h=>{if(h.eval==='exc'){scoreBase+=3;counts.exc++;}else if(h.eval==='good'){scoreBase+=2;counts.good++;}else if(h.eval==='par'){scoreBase+=1;counts.par++;}else{counts.miss++;}});const diffMult=level==='setup'?1.6:level==='hard'?1.5:level==='normal'?1.2:1.0;const expectedTotal=(timeLimit/15)*5;const speedBonus=history.length/expectedTotal;const rawScore=scoreBase*diffMult*(0.5+speedBonus*0.5);let rankInfo={};if(history.length===0)rankInfo={rank:'UNRANKED',color:'#4A5A4A',comment:'問題に1問も回答できませんでした。',emoji:'💀'};else if(rawScore>=30)rankInfo={rank:'SA RANK',color:'#FF4D8C',comment:'圧倒的なスピードと正確さ。プロ並みのチェックアウト能力です！',emoji:'👑'};else if(rawScore>=20)rankInfo={rank:'AA RANK',color:'#F5E642',comment:'非常に優秀。本番でも即座に対応できる実力です。',emoji:'⭐'};else if(rawScore>=12)rankInfo={rank:'A RANK',color:'#00FF7F',comment:'高い実力の持ち主。重要なフィニッシュを確実に理解しています。',emoji:'🎯'};else if(rawScore>=7)return{rank:'BB RANK',color:'#FF8C00',comment:'平均以上の理解度。主要アレンジは把握できています。',emoji:'🔥'};else if(rawScore>=4)return{rank:'B RANK',color:'#88AAFF',comment:'基礎的なアレンジは理解できています。スピードを磨きましょう。',emoji:'📊'};else rankInfo={rank:'C RANK',color:'#8AB890',comment:'まだ学習段階です。基本のアレンジから反復練習しましょう。',emoji:'📝'};return{...rankInfo,counts,rawScore:Math.round(rawScore)};}
function showTAResult(){document.getElementById('board-area').style.display='none';document.querySelector('.bottom-panel').style.display='none';document.getElementById('ta-result').classList.add('show');clearHL();const rankData=calcTARank(ST.ta.history,ST.ta.totalTime,ST.level);document.getElementById('ta-bd-exc').textContent=rankData.counts.exc;document.getElementById('ta-bd-good').textContent=rankData.counts.good;document.getElementById('ta-bd-par').textContent=rankData.counts.par;document.getElementById('ta-bd-miss').textContent=rankData.counts.miss;document.getElementById('ta-final-calc-score').textContent=rankData.rawScore;const badge=document.getElementById('ta-rank-badge');const label=document.getElementById('ta-rank-label');const comment=document.getElementById('ta-rank-comment');badge.textContent=rankData.emoji+' '+rankData.rank;badge.style.color=rankData.color;badge.style.textShadow=`0 0 16px ${rankData.color}80`;label.textContent='ARRANGE RANK';comment.textContent=rankData.comment;saveHist({type:'ta',score:ST.ta.correct,label:`TA(${ST.ta.totalTime}s)[${ST.level.toUpperCase()}]: 総合${rankData.rawScore}pts ${rankData.rank}`,ts:Date.now()});const revContainer=document.getElementById('ta-review-list');if(ST.ta.history.length===0){revContainer.innerHTML='';}else{const reviewHtml=ST.ta.history.map((h,i)=>{let icon='✕';let color='var(--rd)';let txt='Miss';if(h.eval==='exc'){icon='◎';color='var(--gr)';txt='Perfect';}else if(h.eval==='good'){icon='◯';color='var(--yw)';txt='Good';}else if(h.eval==='par'){icon='△';color='var(--or)';txt='Partial';}const inStr=h.timeout?(h.input.length?h.input.join(' → ')+' (時間切れ)':'時間切れ'):h.input.join(' → ');const correctStr=h.correct.length>0?h.correct.join(' → '):"上がり目なし";return`<div style="background:var(--sf); border:1px solid #1E2A1E; border-radius:6px; padding:10px; font-size:12px; margin-bottom:6px; text-align:left;"><div style="display:flex; justify-content:space-between; margin-bottom:6px; align-items:center;"><span style="color:var(--yw); font-family:var(--mo); font-size:15px; font-weight:bold;">Q${i+1}. ${h.score}</span><span style="color:${color}; font-weight:bold; font-size:12px;">${icon} ${txt}</span></div><div style="color:var(--wh); margin-bottom:4px;"><span style="color:var(--mu); font-size:10px;">あなたの回答:</span> <span style="font-family:var(--mo); font-weight:bold; font-size:13px;">${inStr||'なし'}</span></div>${h.eval!=='exc'?`<div style="color:var(--gr); margin-bottom:6px;"><span style="color:var(--mu); font-size:10px;">セオリー:</span> <span style="font-family:var(--mo); font-weight:bold; font-size:13px;">${correctStr}</span></div>`:''}</div>`;}).join('');revContainer.innerHTML=`<div style="font-size:12px; font-weight:700; color:var(--mu); letter-spacing:2px; margin-bottom:10px; text-align:center; padding-top:20px; border-top:1px solid #1E2A1E;">REVIEW (答え合わせ)</div>`+reviewHtml;}}

function getWeakTop10(){const map={};for(const h of ST.history){if(!h.type.startsWith('quiz_'))continue;if(!h.score)continue;if(!map[h.score])map[h.score]={ng:0,ok:0};if(h.type==='quiz_miss'||h.type==='quiz_par')map[h.score].ng++;else map[h.score].ok++;}const scored=Object.entries(map).filter(([s,v])=>v.ng>0).map(([s,v])=>{const total=v.ng+v.ok;const ngRate=total>0?v.ng/total:0;return{score:parseInt(s),ng:v.ng,ok:v.ok,total,ngRate};}).sort((a,b)=>b.ng!==a.ng?b.ng-a.ng:b.ngRate-a.ngRate).slice(0,10);return scored;}

function switchView(name,btn){document.getElementById('view-training').className='';['table','history'].forEach(v=>{const el=document.getElementById('view-'+v);if(el)el.className='view';});document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');if(name==='training'){document.getElementById('view-training').className='active';}else{document.getElementById('view-'+name).className='view active';}if(name==='table')renderTable();if(name==='history')renderHistory();}
let _dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_dp=e;document.getElementById('install-banner').classList.add('show');});window.addEventListener('appinstalled',()=>{document.getElementById('install-banner').classList.remove('show');_dp=null;});
function pwaInstall(){if(_dp){_dp.prompt();_dp.userChoice.then(r=>{if(r.outcome==='accepted')_dp=null;});}else{const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);if(isIOS){alert('iPhoneでのインストール方法:\n\n① SafariでこのURLを開く\n② 画面下の「共有」ボタン(□↑)をタップ\n③「ホーム画面に追加」をタップ\n④「追加」をタップ\n\nアイコンがホーム画面に追加されます！');}else{alert('ホーム画面への追加方法:\n\nブラウザのメニュー(右上「⋮」ボタンなど)から「ホーム画面に追加」または「インストール」をタップしてください。');}}document.getElementById('install-banner').classList.remove('show');}
function dismissInstall(){document.getElementById('install-banner').classList.remove('show');}
function checkIOSInstall(){const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);const isSafari=/^((?!chrome|android).)*safari/i.test(navigator.userAgent);const isStandalone='standalone' in navigator&&navigator.standalone;if(isIOS&&isSafari&&!isStandalone){setTimeout(()=>{document.getElementById('install-banner').classList.add('show');document.getElementById('install-btn').textContent='追加方法';},2000);}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
buildBoard();nextQuestion();setTimeout(checkIOSInstall,1500);
</script>
