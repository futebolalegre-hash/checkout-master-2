<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Master</title>
<style>
    html, body { margin: 0; padding: 0; background: #0D1117; color: #E8EEE8; height: 100%; }
    .app-container { display: flex; flex-direction: column; height: 100vh; }
    header { padding: 15px; border-bottom: 1px solid #333; }
    .logo-main { font-family: sans-serif; font-size: 20px; color: #FF4D8C; }
    .board-area { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
    #dartboard { width: 90%; max-width: 400px; height: auto; }
    .bottom-panel { padding: 20px; text-align: center; }
    .btn { padding: 15px 40px; background: #00FF7F; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0D1117; }
</style>
</head>
<body>
    <div class="app-container">
        <header><div class="logo"><span class="logo-main">Checkout Master</span> <small>ver.1.07</small></div></header>
        <div class="board-area">
            <svg id="dartboard" viewBox="0 0 400 400"></svg>
        </div>
        <div class="bottom-panel"><button class="btn" onclick="checkData()">🎯 データ数を確認</button></div>
    </div>
    <script>
        // 934パターンの統合データ
        window.CUSTOM_DB = {
            "75_0_1":{"a":"T17 D12"},
            "180_0_1":{"a":"T20 T20 T20","m":"トンパチ！"}
            // ※ここに第1部〜第5部で貼り付けていただいた全データを繋げてください
        };

        function buildBoard() {
            const svg = document.getElementById('dartboard');
            svg.innerHTML = '';
            for(let i=0; i<20; i++) {
                const angle = i * 18 * Math.PI / 180;
                const x2 = 200 + 180 * Math.cos(angle);
                const y2 = 200 + 180 * Math.sin(angle);
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', '200'); line.setAttribute('y1', '200');
                line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                line.setAttribute('stroke', '#9A9070'); line.setAttribute('stroke-width', '2');
                svg.appendChild(line);
            }
            const outer = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            outer.setAttribute('cx','200'); outer.setAttribute('cy','200'); outer.setAttribute('r','180');
            outer.setAttribute('fill','none'); outer.setAttribute('stroke','#9A9070'); outer.setAttribute('stroke-width','5');
            svg.appendChild(outer);
        }

        function checkData() {
            const count = Object.keys(window.CUSTOM_DB).length;
            alert("読み込み成功！現在のアレンジ登録数: " + count + "件");
        }

        buildBoard();
    </script>
</body>
</html>
