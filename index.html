<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CheckoutMaster">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D1117">
<link rel="manifest" id="pwa-manifest">
<title>CHECKOUT MASTER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
:root{
  --bg:#0D1117;--sf:#161C24;--s2:#1A2410;
  --gr:#00FF7F;--gd:#00994C;--rd:#FF4444;
  --yw:#F5E642;--or:#FF8C00;--wh:#E8EEE8;--mu:#5A6A5A;
  --pk:#FF4D8C;
  --mo:'Courier New',monospace;
  --sa:-apple-system,'Helvetica Neue',Arial,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
body{background:var(--bg);color:var(--wh);font-family:var(--sa);
  display:flex;flex-direction:column;height:100dvh;height:100vh;}

/* ── ヘッダー ── */
header{border-bottom:1px solid #1E2A1E;padding:8px 14px;
  padding-top:calc(8px + var(--st));
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  min-height:52px;}
.logo{
  font-family:'Impact','Arial Black','Helvetica Neue',sans-serif;
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  color:var(--pk);
  text-shadow:0 0 12px rgba(255,77,140,0.5), 0 2px 4px rgba(0,0,0,0.8);
  line-height:1;
}
.nav-tabs{display:flex;gap:4px;}
.nav-tab{background:none;border:1px solid transparent;color:var(--mu);
  font-size:13px;font-weight:600;letter-spacing:1px;padding:6px 12px;cursor:pointer;
  border-radius:5px;transition:all .15s;font-family:var(--sa);}
.nav-tab.active{border-color:var(--gd);color:var(--gr);background:rgba(0,255,127,.08);}

/* ── TRAINING ── */
#view-training{display:none;flex-direction:column;
  height:calc(100dvh - 52px);height:calc(100vh - 52px);
  padding:6px 12px;overflow:hidden;}
#view-training.active{display:flex;}

.view{display:none;}
.view.active{display:block;padding:12px 14px;
  height:calc(100dvh - 52px);height:calc(100vh - 52px);
  overflow-y:auto;overflow-x:hidden;}

/* ── TOP CONTROLS ── */
.top-controls{flex-shrink:0;}
.stats-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:5px;}
.stat-box{background:var(--sf);border:1px solid #1E2A1E;border-radius:7px;padding:5px 4px;text-align:center;}
.stat-val{font-family:var(--mo);font-size:20px;font-weight:bold;color:var(--yw);display:block;}
.stat-lbl{font-size:11px;font-weight:600;color:var(--mu);letter-spacing:1px;display:block;margin-top:1px;}

.ctrl-row{display:flex;gap:5px;margin-bottom:5px;}
.ctrl-btn{flex:1;padding:6px 2px;border-radius:6px;border:1px solid #2A3A2A;
  background:none;color:var(--mu);font-size:12px;font-weight:600;cursor:pointer;
  transition:all .12s;font-family:var(--sa);text-align:center;line-height:1.3;}
.ctrl-btn.active{border-color:var(--gd);color:var(--gr);background:rgba(0,255,127,.08);}
.ctrl-btn .ci{display:block;font-size:15px;margin-bottom:1px;}

.settings-row{display:flex;flex-direction:column;gap:4px;margin-bottom:5px;}
.settings-line{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;}
.sg{display:flex;gap:3px;align-items:center;}
.slbl{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:1px;white-space:nowrap;margin-right:2px;}
.pill{padding:4px 8px;border-radius:4px;border:1px solid #2A3A2A;
  background:none;color:var(--mu);font-size:11px;font-weight:600;cursor:pointer;
  transition:all .12s;font-family:var(--sa);white-space:nowrap;}
.pill.active{border-color:var(--gd);color:var(--gr);background:rgba(0,255,127,.08);}
.vsep{width:1px;background:#2A3A2A;align-self:stretch;margin:0 3px;}

/* ── TIMER ── */
.timer-area{flex-shrink:0;margin-bottom:4px;display:none;}
.timer-top{display:flex;align-items:baseline;justify-content:center;gap:5px;}
.timer-num{font-family:var(--mo);font-size:30px;font-weight:bold;color:var(--or);}
.timer-num.danger{color:var(--rd);animation:pulse .5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.timer-lbl{font-size:13px;color:var(--mu);}
.timer-bar{height:4px;background:var(--s2);border-radius:2px;overflow:hidden;margin-top:2px;}
.timer-fill{height:100%;background:var(--or);transition:width .1s linear;border-radius:2px;}
.timer-fill.danger{background:var(--rd);}

/* ── BOARD AREA ── */
.board-area{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-badge{font-family:var(--mo);font-size:42px;font-weight:bold;color:var(--yw);line-height:1;text-align:center;flex-shrink:0;}
.score-sub{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--mu);text-align:center;margin-bottom:3px;flex-shrink:0;}

.board-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:0 6px;}
.board-wrap svg{width:min(calc(100% - 4px),100%);height:100%;max-width:310px;max-height:310px;
  display:block;overflow:visible;filter:drop-shadow(0 3px 14px rgba(0,0,0,.85));touch-action:manipulation;}
@keyframes segFlash{0%{opacity:1}40%{opacity:.15}100%{opacity:1}}
.seg-flash{animation:segFlash .2s ease-out;}

/* ── TA RESULT ── */
.ta-result{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;gap:10px;}
.ta-result.show{display:flex;}
.ta-score-big{font-family:var(--mo);font-size:72px;font-weight:bold;color:var(--yw);line-height:1;}
.ta-lbl{font-size:13px;font-weight:600;letter-spacing:3px;color:var(--mu);}
.ta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:240px;}
.ta-cell{background:var(--sf);border:1px solid #1E2A1E;border-radius:7px;padding:10px;}
.ta-cv{font-family:var(--mo);font-size:22px;font-weight:bold;color:var(--wh);display:block;}
.ta-cl{font-size:11px;font-weight:600;color:var(--mu);letter-spacing:1px;}

/* ── BOTTOM PANEL ── */
.bottom-panel{flex-shrink:0;}
.throw-counter{text-align:center;font-size:12px;font-weight:600;color:var(--mu);letter-spacing:1px;margin-bottom:3px;}
.throw-log{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:28px;margin-bottom:4px;}
.tchip{background:var(--s2);border:1px solid #2A3A2A;border-radius:5px;
  padding:4px 10px;font-family:var(--mo);font-size:13px;font-weight:bold;color:var(--wh);
  display:flex;align-items:center;gap:4px;}
.tchip.hit{border-color:var(--gd);color:var(--gr);}
.tchip.miss{border-color:var(--rd);color:var(--rd);}
.tchip.partial{border-color:var(--or);color:var(--or);}

.result-banner{border-radius:6px;padding:7px 11px;font-size:12px;font-weight:600;
  margin-bottom:4px;display:none;align-items:flex-start;gap:7px;}
.result-banner.show{display:flex;}
.result-banner.correct{background:rgba(0,255,127,.1);border:1px solid var(--gd);color:var(--gr);}
.result-banner.wrong{background:rgba(255,68,68,.08);border:1px solid #662222;color:var(--rd);}
.result-banner.partial{background:rgba(255,140,0,.08);border:1px solid #885500;color:var(--or);}

.theory-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--mu);margin-bottom:3px;user-select:none;}
.theory-toggle input{accent-color:var(--gr);width:14px;height:14px;cursor:pointer;}

.theory-panel{background:#0F1A0F;border:1px solid #1E3A1E;border-radius:6px;
  padding:7px 10px;margin-bottom:4px;font-size:12px;line-height:1.7;
  color:#8AB890;display:none;max-height:90px;overflow-y:auto;}
.theory-panel.show{display:block;}
.tpt{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--gd);margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.tpt::before{content:'';display:inline-block;width:5px;height:5px;background:var(--gd);border-radius:50%;}
.tsec strong{color:var(--wh);font-family:var(--mo);font-size:12px;}
.miss-case{background:rgba(255,68,68,.07);border-left:2px solid #662222;
  padding:4px 8px;border-radius:0 3px 3px 0;margin-top:4px;font-size:11px;color:#CC8888;}
.order-note{background:rgba(255,140,0,.07);border-left:2px solid #885500;
  padding:4px 8px;border-radius:0 3px 3px 0;margin-top:4px;font-size:11px;color:#DDAA66;}

.btn-row{display:flex;gap:7px;}
.btn{flex:1;padding:11px;border-radius:7px;border:none;font-size:13px;font-weight:700;
  letter-spacing:1px;cursor:pointer;font-family:var(--sa);transition:all .12s;}
.btn-primary{background:var(--gr);color:#0D1117;}
.btn-secondary{background:var(--s2);color:var(--mu);border:1px solid #2A3A2A;}
.btn-orange{background:var(--or);color:#0D1117;}

/* ── TABLE ── */
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.filter-chip{background:none;border:1px solid #2A3A2A;color:var(--mu);font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:20px;cursor:pointer;letter-spacing:1px;}
.filter-chip.active{border-color:var(--gd);color:var(--gr);background:rgba(0,255,127,.08);}
.arr-table{display:flex;flex-direction:column;gap:4px;}
.arr-row{background:var(--sf);border:1px solid #1E2A1E;border-radius:7px;
  padding:10px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .12s;}
.arr-row:hover{border-color:var(--gd);}
.ar-s{font-family:var(--mo);font-size:19px;font-weight:bold;color:var(--yw);width:36px;text-align:right;flex-shrink:0;}
.ar-t{flex:1;font-size:13px;font-weight:600;color:var(--wh);}
.ar-t small{color:var(--mu);font-size:11px;display:block;margin-top:2px;line-height:1.4;}
.ar-tag{font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:3px;
  background:var(--s2);color:var(--mu);flex-shrink:0;}
.ar-tag.bull{background:rgba(245,230,66,.1);color:var(--yw);}
.ar-tag.double{background:rgba(0,255,127,.07);color:var(--gd);}
.ar-tag.key{background:rgba(255,140,0,.12);color:var(--or);}
.arr-det{display:none;background:#0F1A0F;border:1px solid #1E3A1E;border-top:none;
  padding:10px 13px;font-size:12px;color:#8AB890;line-height:1.8;border-radius:0 0 7px 7px;}
.arr-det.open{display:block;}
.arr-det strong{color:var(--wh);font-family:var(--mo);}
.arr-det .miss{color:#CC8888;font-size:11px;border-left:2px solid #442222;padding-left:7px;margin-top:5px;display:block;}

/* ── HISTORY ── */
.hist-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.hist-ttl{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--mu);}
.clr-btn{background:none;border:1px solid #2A3A2A;color:var(--mu);font-size:12px;font-weight:600;padding:5px 11px;border-radius:5px;cursor:pointer;}
.clr-btn:hover{color:var(--rd);border-color:#662222;}
.hist-list{display:flex;flex-direction:column;gap:5px;}
.hist-item{background:var(--sf);border:1px solid #1E2A1E;border-radius:7px;padding:9px 13px;display:flex;align-items:center;gap:10px;}
.hi-s{font-family:var(--mo);font-size:19px;font-weight:bold;color:var(--yw);width:40px;flex-shrink:0;}
.hi-a{flex:1;font-size:13px;font-weight:600;color:var(--wh);}
.hi-a small{color:var(--mu);font-size:11px;display:block;}
.hi-r{font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:4px;flex-shrink:0;}
.hi-r.ok{background:rgba(0,255,127,.1);color:var(--gr);}
.hi-r.ng{background:rgba(255,68,68,.1);color:var(--rd);}
.hi-r.half{background:rgba(255,140,0,.15);color:var(--or);}
.hi-r.ta{background:rgba(255,140,0,.15);color:var(--or);}
.empty-state{text-align:center;padding:40px 20px;color:var(--mu);font-size:13px;line-height:2.2;}

/* ── PWA INSTALL BANNER ── */
.install-banner{background:var(--sf);border-top:1px solid #1E2A1E;
  padding:8px 14px;padding-bottom:calc(8px + var(--sb));
  display:none;align-items:center;gap:9px;flex-shrink:0;}
.install-banner.show{display:flex;}
.install-txt{flex:1;font-size:12px;font-weight:600;color:var(--mu);line-height:1.5;}
.install-txt b{color:var(--wh);}
.install-btn{background:var(--gr);color:#0D1117;border:none;border-radius:6px;
  padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;}
.install-close{background:none;border:none;color:var(--mu);cursor:pointer;font-size:18px;padding:2px 5px;}
</style>
</head>
<body>

<header>
  <div class="logo">CHECKOUT MASTER</div>
  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('training',this)">練習</button>
    <button class="nav-tab" onclick="switchView('table',this)">表</button>
    <button class="nav-tab" onclick="switchView('history',this)">履歴</button>
  </nav>
</header>

<div id="view-training" class="active">
  <div class="top-controls">
    <div class="stats-bar">
      <div class="stat-box"><span class="stat-val" id="stat-total">0</span><span class="stat-lbl">TOTAL</span></div>
      <div class="stat-box"><span class="stat-val" id="stat-correct">0</span><span class="stat-lbl">CORRECT</span></div>
      <div class="stat-box"><span class="stat-val" id="stat-rate">—</span><span class="stat-lbl">RATE</span></div>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn active" onclick="setMode(this,'quiz')"><span class="ci">🎯</span>QUIZ</button>
      <button class="ctrl-btn" onclick="setMode(this,'timeattack')"><span class="ci">⏱</span>TIME ATTACK</button>
      <button class="ctrl-btn" onclick="setMode(this,'study')"><span class="ci">📖</span>STUDY</button>
    </div>
    <div class="settings-row">
      <!-- 1行目: OUT / BULL -->
      <div class="settings-line">
        <div class="sg"><span class="slbl">OUT</span>
          <button class="pill active" id="out-master" onclick="setOutMode(this,'master')">MASTER</button>
          <button class="pill"        id="out-open"   onclick="setOutMode(this,'open')">OPEN</button>
        </div>
        <div class="vsep"></div>
        <div class="sg"><span class="slbl">BULL</span>
          <button class="pill active" id="bull-fat" onclick="setBull(this,'fat')">FAT</button>
          <button class="pill"        id="bull-sep" onclick="setBull(this,'sep')">SEPA</button>
        </div>
      </div>
      <!-- 2行目: SEC(TAのみ) + LV -->
      <div class="settings-line">
        <div class="sg" id="ta-time-group" style="display:none"><span class="slbl">SEC</span>
          <button class="pill active" id="ta15" onclick="setTATime(this,15)">15</button>
          <button class="pill"        id="ta30" onclick="setTATime(this,30)">30</button>
          <button class="pill"        id="ta60" onclick="setTATime(this,60)">60</button>
        </div>
        <div class="vsep" id="ta-vsep" style="display:none"></div>
        <div class="sg" id="level-group"><span class="slbl">LV</span>
          <button class="pill active" onclick="setLevel(this,'easy')">E</button>
          <button class="pill"        onclick="setLevel(this,'normal')">N</button>
          <button class="pill"        onclick="setLevel(this,'hard')">H</button>
        </div>
      </div>
    </div>
  </div>

  <div class="timer-area" id="ta-timer-area">
    <div class="timer-top"><span class="timer-num" id="timer-display">15</span><span class="timer-lbl">sec</span></div>
    <div class="timer-bar"><div class="timer-fill" id="timer-bar" style="width:100%"></div></div>
  </div>

  <div class="board-area" id="board-area">
    <div class="score-badge" id="current-score">—</div>
    <div class="score-sub">REMAINING</div>
    <div class="board-wrap">
      <svg id="dartboard" viewBox="-15 -15 430 430" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="ta-result" id="ta-result">
    <div class="ta-score-big" id="ta-final-score">0</div>
    <div class="ta-lbl">CORRECT ANSWERS</div>
    <div class="ta-grid">
      <div class="ta-cell"><span class="ta-cv" id="ta-bd-total">0</span><span class="ta-cl">TOTAL</span></div>
      <div class="ta-cell"><span class="ta-cv" id="ta-bd-rate">—</span><span class="ta-cl">RATE</span></div>
    </div>
    <button class="btn btn-orange" onclick="startTimeAttack()" style="width:130px;margin-top:4px;">もう一度</button>
  </div>

  <div class="bottom-panel">
    <div class="throw-counter" id="throw-counter">ボードをタップして投げ方を入力</div>
    <div class="throw-log" id="throw-log"></div>
    <div class="result-banner" id="result-banner">
      <span id="result-icon">✓</span>
      <div><span id="result-text">—</span></div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:2px;">
      <label class="theory-toggle" id="theory-toggle-label">
        <input type="checkbox" id="theory-toggle" onchange="toggleTheory(this.checked)">解説モードON
      </label>
      <label class="theory-toggle" id="sound-toggle-label">
        <input type="checkbox" id="sound-toggle" checked onchange="toggleSound(this.checked)">🔊 効果音ON
      </label>
    </div>
    <div class="theory-panel" id="theory-panel">
      <div class="tpt">ARRANGE THEORY</div>
      <div id="theory-content"></div>
    </div>
    <div class="btn-row" id="main-btns">
      <button class="btn btn-secondary" onclick="showAnswer()" id="btn-hint">答えを見る</button>
      <button class="btn btn-primary"   onclick="nextQuestion()">次へ →</button>
    </div>
    <div class="btn-row" id="ta-start-btn" style="display:none">
      <button class="btn btn-orange" onclick="startTimeAttack()">▶ スタート</button>
    </div>
  </div>
</div>

<div class="view" id="view-table">
  <div class="filter-row">
    <button class="filter-chip active" onclick="filterTable(this,'all')">すべて</button>
    <button class="filter-chip" onclick="filterTable(this,'key')">必須</button>
    <button class="filter-chip" onclick="filterTable(this,'bull')">BULL</button>
    <button class="filter-chip" onclick="filterTable(this,'double')">DOUBLE</button>
    <button class="filter-chip" onclick="filterTable(this,'high')">HIGH(120+)</button>
  </div>
  <div class="arr-table" id="arrange-table"></div>
</div>

<div class="view" id="view-history">
  <div class="hist-hdr">
    <div class="hist-ttl">練習履歴</div>
    <button class="clr-btn" onclick="clearHistory()">クリア</button>
  </div>
  <div class="hist-list" id="history-list"></div>
</div>



<script>
// ═══════════════════════════════════════════
//  PHOENIX BOARD
// ═══════════════════════════════════════════
const CX=200,CY=200;
// タップしやすさ優先の半径設定
// Bull内: 広め, アウターブル: 広め, トリプル: 広め, ダブル: 広め
const R={
  bi:26,   // インナーブル (実機比約1.5倍)
  bo:52,   // アウターブル (実機比約1.5倍)
  ti:98,   // トリプル内縁
  to:132,  // トリプル外縁 (幅34→実機の約1.8倍)
  di:158,  // ダブル内縁
  do_:194  // ダブル外縁 (幅36→実機の約1.8倍)
};
const SECTORS=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const N=20,DEG=18;
const PHX={
  blk:'#1C100A',crm:'#EDE0A8',
  red:'#B8172A',grn:'#1A6535',
  bull_out_fill:'#B8172A', // アウターブル: 赤
  bull_in_fill:'#0A0A0A',  // インナーブル: 黒
  wire:'#9A9070',
  sel_ok:'rgba(0,230,90,0.65)',
  sel_ng:'rgba(255,40,40,0.65)',
  sel_yw:'rgba(240,215,30,0.65)',
  sel_or:'rgba(255,140,0,0.55)',
};
const ns='http://www.w3.org/2000/svg';

function polar(r,deg){const rad=(deg-90)*Math.PI/180;return[CX+r*Math.cos(rad),CY+r*Math.sin(rad)];}
function arc(r1,r2,a1,a2){
  const[x1,y1]=polar(r1,a1),[x2,y2]=polar(r2,a1);
  const[x3,y3]=polar(r2,a2),[x4,y4]=polar(r1,a2);
  const lg=(a2-a1)>180?1:0;

function mkPath(svg,label,val,d,fill,ev){
  const p=document.createElementNS(ns,'path');
  p.setAttribute('d',d);p.setAttribute('fill',fill);
  p.setAttribute('data-orig-fill',fill); // ハイライト解除時の元色
  p.setAttribute('stroke',PHX.wire);p.setAttribute('stroke-width','0.4');
  p.setAttribute('data-seg',label);p.setAttribute('data-val',val);
  if(ev){p.style.cursor='pointer';p.addEventListener('click',()=>onTap(label,val));}
  svg.appendChild(p);return p;
}
function buildBoard(){
  const svg=document.getElementById('dartboard');svg.innerHTML='';
  const bg=document.createElementNS(ns,'circle');
  bg.setAttribute('cx',CX);bg.setAttribute('cy',CY);bg.setAttribute('r',R.do_+12);
  bg.setAttribute('fill','#0C0C0A');svg.appendChild(bg);
  const nr=document.createElementNS(ns,'circle');
  nr.setAttribute('cx',CX);nr.setAttribute('cy',CY);nr.setAttribute('r',R.do_+7);
  nr.setAttribute('fill','#181208');svg.appendChild(nr);
  for(let i=0;i<N;i++){
    const num=SECTORS[i],a1=i*DEG-DEG/2,a2=a1+DEG,even=i%2===0;
    const sc=even?PHX.blk:PHX.crm,bc=even?PHX.red:PHX.grn;
    mkPath(svg,`S${num}`,num,arc(R.to,R.di,a1,a2),sc,true);
    mkPath(svg,`D${num}`,num*2,arc(R.di,R.do_,a1,a2),bc,true);
    mkPath(svg,`S${num}`,num,arc(R.bo,R.ti,a1,a2),sc,true);
    mkPath(svg,`T${num}`,num*3,arc(R.ti,R.to,a1,a2),bc,true);
  }
  // アウターブル (S25) — 赤
  mkPath(svg,'S25',25,arc(R.bi,R.bo,0,359.99),PHX.bull_out_fill,true);
  // インナーブル (Bull) — 完全な黒、明示的に固定
  const bi=document.createElementNS(ns,'circle');
  bi.setAttribute('cx',CX);bi.setAttribute('cy',CY);bi.setAttribute('r',R.bi);
  bi.setAttribute('fill','#0A0A0A');
  bi.setAttribute('data-orig-fill','#0A0A0A'); // clearHL用に元色を保持
  bi.setAttribute('stroke','#6A6050');bi.setAttribute('stroke-width','1.2');
  bi.setAttribute('data-seg','Bull');bi.setAttribute('data-val','50');
  bi.style.cursor='pointer';bi.addEventListener('click',()=>onTap('Bull',50));
  svg.appendChild(bi);
  for(let i=0;i<N;i++){
    const num=SECTORS[i],[lx,ly]=polar(R.do_+10,i*DEG);
    const t=document.createElementNS(ns,'text');
    t.setAttribute('x',lx);t.setAttribute('y',ly);
    t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');
    t.setAttribute('font-size','14');t.setAttribute('font-family','Courier New,monospace');
    t.setAttribute('fill','#D8CCA0');t.setAttribute('font-weight','bold');
    t.setAttribute('pointer-events','none');t.textContent=num;svg.appendChild(t);
  }
  [R.bi,R.bo,R.ti,R.to,R.di,R.do_].forEach(r=>{
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',CX);c.setAttribute('cy',CY);c.setAttribute('r',r);
    c.setAttribute('fill','none');c.setAttribute('stroke',PHX.wire);
    c.setAttribute('stroke-width','1.5');c.setAttribute('pointer-events','none');svg.appendChild(c);
  });
  for(let i=0;i<N;i++){
    const deg=i*DEG-DEG/2,[x1,y1]=polar(R.bo,deg),[x2,y2]=polar(R.do_,deg);
    const l=document.createElementNS(ns,'line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke',PHX.wire);l.setAttribute('stroke-width','1.5');l.setAttribute('pointer-events','none');
    svg.appendChild(l);
  }
}
let _hl=[];
function clearHL(){
  _hl.forEach(({el,f})=>{
    // data-orig-fill が設定されている要素（インナーブル）はそちらを優先
    const orig=el.getAttribute('data-orig-fill');
    el.setAttribute('fill', orig||f);
  });
  _hl=[];
}
function hlSeg(label,color){
  document.querySelectorAll(`[data-seg="${label}"]`).forEach(el=>{
    const orig=el.getAttribute('data-orig-fill');
    _hl.push({el,f:orig||el.getAttribute('fill')});
    el.setAttribute('fill',color);
  });
}
function flashSeg(label){
  document.querySelectorAll(`[data-seg="${label}"]`).forEach(el=>{
    el.classList.remove('seg-flash');void el.offsetWidth;el.classList.add('seg-flash');
  });
}

// ═══════════════════════════════════════════
//  PHOENIX SOUND ENGINE v2
//  Phoenix実機イメージ:
//    Single  = 「トゥン」     短く軽いヒット音
//    Double  = 「トゥトゥーン」 2音符+余韻
//    Triple  = 「トゥトゥトゥーン」 3音符+余韻
//    OutBull = 「ドゥーン！」  重低音+迫力
//    InBull  = 「ドゥドゥーン！」 超迫力、2段階爆発
// ═══════════════════════════════════════════
const SND={
  enabled:true,
  _ac:null,

  _getAC(){
    if(!this._ac) this._ac=new(window.AudioContext||window.webkitAudioContext)();
    if(this._ac.state==='suspended') this._ac.resume();
    return this._ac;
  },

  // 基本トーン: 「トゥ」の1音
  // freq=周波数, vol=音量, dur=長さ, attack=立ち上がり, startTime=開始時刻
  _tu(freq, vol, dur, attack, startTime){
    const ac=this._getAC();
    const t=startTime||ac.currentTime;
    const osc=ac.createOscillator();
    const gain=ac.createGain();
    const filter=ac.createBiquadFilter();
    filter.type='bandpass'; filter.frequency.value=freq*1.2; filter.Q.value=2;
    osc.connect(filter); filter.connect(gain); gain.connect(ac.destination);
    osc.type='triangle'; osc.frequency.setValueAtTime(freq*1.1,t);
    osc.frequency.exponentialRampToValueAtTime(freq*0.95,t+dur*0.3);
    gain.gain.setValueAtTime(0.001,t);
    gain.gain.linearRampToValueAtTime(vol,t+attack);
    gain.gain.setValueAtTime(vol,t+attack);
    gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
    osc.start(t); osc.stop(t+dur+0.05);
  },

  // ノイズヒット: インパクト感
  _hit(vol, dur, freq, startTime){
    const ac=this._getAC();
    const t=startTime||ac.currentTime;
    const bufLen=Math.ceil(ac.sampleRate*dur);
    const buf=ac.createBuffer(1,bufLen,ac.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++) data[i]=(Math.random()*2-1);
    const src=ac.createBufferSource(); src.buffer=buf;
    const gain=ac.createGain();
    const f=ac.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=freq||1200; f.Q.value=1.5;
    src.connect(f); f.connect(gain); gain.connect(ac.destination);
    gain.gain.setValueAtTime(vol,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.start(t); src.stop(t+dur+0.02);
  },

  // 低音ブースト: Bull用の迫力低音
  _boom(freq, vol, dur, startTime){
    const ac=this._getAC();
    const t=startTime||ac.currentTime;
    const osc=ac.createOscillator();
    const gain=ac.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(freq,t);
    osc.frequency.exponentialRampToValueAtTime(freq*0.5,t+dur);
    osc.connect(gain); gain.connect(ac.destination);
    gain.gain.setValueAtTime(vol,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
    osc.start(t); osc.stop(t+dur+0.05);
  },

  // ── SINGLE: 「トゥン」1音 ──
  single(){
    if(!this.enabled)return;
    try{
      const ac=this._getAC(); const t=ac.currentTime;
      this._hit(0.15, 0.06, 1800, t);
      this._tu(520, 0.10, 0.12, 0.005, t);
    }catch(e){}
  },

  // ── DOUBLE: 「トゥトゥーン」2音+余韻 ──
  double(){
    if(!this.enabled)return;
    try{
      const ac=this._getAC(); const t=ac.currentTime;
      const gap=0.10; // 2音の間隔
      // 1音目「トゥ」
      this._hit(0.18, 0.05, 1600, t);
      this._tu(620, 0.12, 0.10, 0.005, t);
      // 2音目「トゥーン」(少し高め、長め)
      this._hit(0.20, 0.07, 1800, t+gap);
      this._tu(780, 0.15, 0.20, 0.005, t+gap);
      // 余韻
      this._tu(780*0.5, 0.04, 0.18, 0.01, t+gap+0.10);
    }catch(e){}
  },

  // ── TRIPLE: 「トゥトゥトゥーン」3音+余韻 ──
  triple(){
    if(!this.enabled)return;
    try{
      const ac=this._getAC(); const t=ac.currentTime;
      const gap=0.09;
      // 1音目「トゥ」
      this._hit(0.18, 0.05, 1400, t);
      this._tu(580, 0.11, 0.09, 0.005, t);
      // 2音目「トゥ」
      this._hit(0.20, 0.05, 1600, t+gap);
      this._tu(700, 0.12, 0.09, 0.005, t+gap);
      // 3音目「トゥーン」(高め、長め)
      this._hit(0.24, 0.07, 1900, t+gap*2);
      this._tu(880, 0.16, 0.22, 0.005, t+gap*2);
      // 余韻(きらめき感)
      this._tu(880*0.5, 0.05, 0.20, 0.01, t+gap*2+0.12);
      this._tu(880*1.5, 0.03, 0.15, 0.01, t+gap*2+0.08);
    }catch(e){}
  },

  // ── OUTER BULL: 「ドゥーン！」重低音+迫力 ──
  outerBull(){
    if(!this.enabled)return;
    try{
      const ac=this._getAC(); const t=ac.currentTime;
      // 重いインパクトノイズ
      this._hit(0.40, 0.12, 300, t);
      this._hit(0.25, 0.18, 1200, t);
      // 重低音「ドゥ」
      this._boom(80, 0.35, 0.35, t);
      this._boom(120, 0.20, 0.30, t);
      // 「ーン」余韻
      this._tu(220, 0.18, 0.40, 0.02, t+0.05);
      this._tu(180, 0.10, 0.50, 0.04, t+0.08);
    }catch(e){}
  },

  // ── INNER BULL: 「ドゥドゥーン！！」超迫力2段階 ──
  innerBull(){
    if(!this.enabled)return;
    try{
      const ac=this._getAC(); const t=ac.currentTime;
      // 第1爆発「ドゥ」
      this._hit(0.50, 0.10, 200, t);
      this._hit(0.30, 0.14, 800, t);
      this._boom(60, 0.45, 0.25, t);
      this._boom(100, 0.30, 0.20, t);
      this._tu(200, 0.20, 0.18, 0.01, t);

      // 第2爆発「ドゥーン！！」(0.12秒後)
      const t2=t+0.12;
      this._hit(0.55, 0.14, 250, t2);
      this._hit(0.35, 0.18, 1000, t2);
      this._boom(55, 0.50, 0.45, t2);
      this._boom(90, 0.35, 0.38, t2);
      this._tu(160, 0.25, 0.55, 0.015, t2);

      // 高音輝き(華やかさ追加)
      this._tu(660, 0.12, 0.25, 0.02, t2+0.05);
      this._tu(990, 0.08, 0.20, 0.02, t2+0.12);
      this._tu(1320,0.05, 0.18, 0.02, t2+0.20);
    }catch(e){}
  },

  play(label){
    if(!this.enabled)return;
    if(label==='Bull')           this.innerBull();
    else if(label==='S25')       this.outerBull();
    else if(label.startsWith('T')) this.triple();
    else if(label.startsWith('D')) this.double();
    else                           this.single();
  }
};

function toggleSound(on){
  SND.enabled=on;
  if(on)try{SND._getAC();}catch(e){}
}

// ═══════════════════════════════════════════
let ST={
  mode:'quiz',level:'easy',bullMode:'fat',outMode:'master',taTime:15,
  current:null,answered:false,showTheory:false,
  input:[],stats:{total:0,correct:0},history:[],
  ta:{active:false,timeLeft:15,totalTime:15,correct:0,total:0,timer:null},
  // シャッフルキュー（連続同問防止）
  _queue:[],_lastScore:null,
};
try{ST.history=JSON.parse(localStorage.getItem('darts_h6')||'[]');}catch(e){}

function getThrows(a){
  // オープンアウトモード: シングルでも上がれるため throws の最終手がDxxの場合Sxxも正解扱い
  // throws定義はマスターアウト基準のまま共用。オープンでは別途判定で吸収。
  return ST.bullMode==='sep'?a.sep:a.fat;
}

// ── オープンアウト正解判定 ──
// オープンアウトルール:
//   ① 途中の本数が正解と同じ
//   ② 最後の1手が「同点で上がれる別表現」であれば◯
//      - DxxならSxx（シングル）も上がり可 ← ダブルのシングル代替
//      - スコア≤20 かつ 最後がSxx（シングル）ならそれ自体で上がり可
//      - Bull(50)ならS25(25)は不可（点数が違う）
//      - マスターアウトでは最後がDxx/Txx/Bullのみ上がり
function isOpenOutCorrect(input, correct){
  if(input.length!==correct.length) return false;
  // 途中の本(最後以外)は全て一致必須
  for(let i=0;i<correct.length-1;i++){
    if(input[i]!==correct[i]) return false;
  }
  const last=correct[correct.length-1];
  const inLast=input[input.length-1];
  if(inLast===last) return true; // 完全一致

  // ── オープンアウト固有の許容 ──

  // DxxのシングルSxx代替（例: 正解D16→S16も可）
  if(last.startsWith('D')){
    const num=parseInt(last.slice(1));
    if(inLast===`S${num}`) return true;
    // さらにTxx（3本上がりで1本余剰にTripleを使う場合）は不可（点数違う）
  }

  // Txx(3×n)のSxx代替: オープンアウトではTxxもシングルアウト可
  // ただしTxxで上がれるのはマスターアウトのみ（Tは1本でフィニッシュ可）
  // オープンアウトではTxxはそのまま上がれる(既に一致チェック済)
  // → Txx→Sxx代替は意味なし（Txx入れば上がれる）

  // シングル(Sxx / 素の数字)で上がれるか: スコアがその点数以下
  // 例えばスコア=17のとき: 正解はS17だが入力がS17はexact一致で処理済
  // オープンアウトなので「正解がDxxで入力がSxx(同じ数字)」以外に
  // 「正解がS17で入力もS17」もexact一致。
  // 問題は「正解D16→S16」「正解Bull→S25」など

  // Bullの場合: Bull(50点)とS25(25点)は点数が違うので代替不可
  // ただしオープンアウトでS25で上がる = 25点丁度ならS25でアウト
  // 本アプリのArrangeはBull=50点前提なので代替させない

  return false;
}

// ── オープンアウトにおける「出題」スロー数の決定 ──
// オープンアウトモードでは最後の手がDxxの場合、Sxxでも上がれる。
// 問題の正解はマスターアウト準拠で持つが、表示・採点時にオープンを考慮。
// また、オープンアウト専用の「最短アレンジ」を返す関数も用意。
function getOpenThrows(a){
  // 基本はfat/sepと同じだが、最後がDxxの場合Sxxでも上がり可能を明示
  return getThrows(a);
}

function getPool(){
  const v=ARRANGES.filter(a=>{const t=getThrows(a);return t&&t.length>0;});
  // オープンアウト：シングルで上がれるのでダブル限定問題も含める（全スコア対象）
  // マスターアウト：既存通り
  if(ST.level==='easy')  return v.filter(a=>a.score<=100);
  if(ST.level==='normal')return v.filter(a=>a.score>=40&&a.score<=150);
  return v;
}

// ── シャッフルキュー管理 ──
function _buildQueue(){
  const pool=getPool();
  // Fisher-Yates shuffle
  const arr=[...pool];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  ST._queue=arr;
}
function _pickNext(){
  if(ST._queue.length===0) _buildQueue();
  // 先頭が直前と同じスコアなら末尾に回す（連続防止）
  if(ST._queue.length>1 && ST._queue[0].score===ST._lastScore){
    ST._queue.push(ST._queue.shift());
  }
  const q=ST._queue.shift();
  ST._lastScore=q.score;
  return q;
}

function normBull(seg){
  if(ST.bullMode==='fat'&&seg==='S25')return'Bull';
  return seg;
}

// ─── ORDER CHECK: 同じナンバー構成だが順序が違う場合を検出 ───
function checkOrder(input,correct){
  if(input.length!==correct.length)return false;
  // same set, different order
  const si=[...input].sort().join(','),sc=[...correct].sort().join(',');
  return si===sc&&JSON.stringify(input)!==JSON.stringify(correct);
}

function onTap(label,val){
  if(ST.answered)return;
  if(ST.mode==='timeattack'&&!ST.ta.active)return;
  const throws=ST.current?getThrows(ST.current):[];
  if(ST.input.length>=throws.length)return;
  const n=normBull(label);
  SND.play(label); // ── 効果音 ──
  flashSeg(label);ST.input.push(n);renderLog();
  if(ST.input.length>=throws.length)setTimeout(checkAnswer,200);
}

function renderLog(overallOk, openOk){
  const q=ST.current,throws=q?getThrows(q):[];
  const log=document.getElementById('throw-log'),ctr=document.getElementById('throw-counter');
  const maxT=throws.length,rem=maxT-ST.input.length;
  const cls_func=(t,i)=>{
    if(!ST.answered)return'tchip';
    if(overallOk)return'tchip hit'; // 全体正解なら全部緑
    const ok=t===throws[i];
    if(ok)return'tchip hit';
    if(checkOrder(ST.input,throws))return'tchip partial';
    return'tchip miss';
  };
  log.innerHTML=ST.input.map((t,i)=>{
    const cls=cls_func(t,i);
    return`<div class="${cls}"><span>${t}</span>${!ST.answered?`<span class="del" onclick="rmThrow(${i})">✕</span>`:''}</div>`;
  }).join('');
  if(!ST.answered){
    ctr.textContent=rem>0?`あと${rem}本タップ（${maxT}本中${ST.input.length}本）`:'確認中…';
  }else{ctr.textContent='';}
}
function rmThrow(i){if(ST.answered)return;ST.input.splice(i,1);renderLog();}

function checkAnswer(){
  if(!ST.current||ST.answered)return;
  ST.answered=true;
  const q=ST.current,correct=getThrows(q),input=ST.input;
  const exactOk=JSON.stringify(input)===JSON.stringify(correct);

  // ── オープンアウト判定 ──
  // 最後の手についてオープンアウト特有の許容:
  //   ① 正解がDxxで入力がSxx(同数) → ◯
  //   ② 正解がSxxで入力がSxx(同数) → exactOkで処理済
  //   ③ スコア≤20 かつ 入力最後がSxx(そのスコア) → ◯  ← シングルアウト
  //   ④ スコア=25 かつ 入力最後がS25 → ◯
  //   ⑤ スコア=50 かつ 入力最後がBull → exactOkで処理済
  const openOk=!exactOk&&ST.outMode==='open'&&(()=>{
    // 途中の本が一致しているか確認
    if(input.length!==correct.length) return false;
    for(let i=0;i<correct.length-1;i++){
      if(input[i]!==correct[i]) return false;
    }
    const last=correct[correct.length-1];
    const inLast=input[input.length-1];
    // ①: DxxのシングルSxx代替
    if(last.startsWith('D')){
      const num=parseInt(last.slice(1));
      if(inLast===`S${num}`) return true;
    }
    // ③: スコア≤20でシングルフィニッシュ（1本上がりの場合のみ）
    if(correct.length===1&&q.score<=20){
      if(inLast===`S${q.score}`) return true;
    }
    // ③': 最後の1手がシングルで残り点数=その数値（多本アレンジの最後）
    if(inLast.startsWith('S')){
      const sVal=parseInt(inLast.slice(1));
      // 最後の手だけの残り点数を計算
      const prevSum=input.slice(0,-1).reduce((a,t)=>{
        if(t==='Bull')return a+50;
        if(t==='S25')return a+25;
        if(t.startsWith('T'))return a+parseInt(t.slice(1))*3;
        if(t.startsWith('D'))return a+parseInt(t.slice(1))*2;
        if(t.startsWith('S'))return a+parseInt(t.slice(1));
        return a;
      },0);
      const remaining=q.score-prevSum;
      if(remaining===sVal&&remaining<=20) return true;
    }
    // ④: S25(25点)フィニッシュ
    if(inLast==='S25'){
      const prevSum=input.slice(0,-1).reduce((a,t)=>{
        if(t==='Bull')return a+50;
        if(t==='S25')return a+25;
        if(t.startsWith('T'))return a+parseInt(t.slice(1))*3;
        if(t.startsWith('D'))return a+parseInt(t.slice(1))*2;
        if(t.startsWith('S'))return a+parseInt(t.slice(1));
        return a;
      },0);
      if(q.score-prevSum===25) return true;
    }
    return false;
  })();

  const ok=exactOk||openOk;
  const partial=!ok&&checkOrder(input,correct);

  clearHL();
  if(ok){
    correct.forEach(s=>hlSeg(s,PHX.sel_ok));
  } else if(partial){
    correct.forEach(s=>hlSeg(s,PHX.sel_or));
  } else {
    correct.forEach(s=>hlSeg(s,PHX.sel_ok));
    input.forEach((s,i)=>{if(s!==correct[i])hlSeg(s,PHX.sel_ng);});
  }

  if(ST.mode==='timeattack'){
    ST.ta.total++;
    if(ok||partial)ST.ta.correct++;
    renderLog();
    setTimeout(()=>{clearHL();if(ST.ta.active){ST.input=[];nextQuestion();}},800);
    return;
  }

  ST.stats.total++;if(ok)ST.stats.correct++;
  const ban=document.getElementById('result-banner');
  if(ok){
    ban.className='result-banner show correct';
    document.getElementById('result-icon').textContent='✓';
    // オープンアウトでシングルで上がった場合の補足
    const openMsg=(openOk&&!exactOk)?' (オープンアウト: シングル上がり◯)':'';
    document.getElementById('result-text').textContent='正解！'+openMsg+' '+(q.theory||'').substring(0,45);
  } else if(partial){
    ban.className='result-banner show partial';
    document.getElementById('result-icon').textContent='△';
    document.getElementById('result-text').textContent='ナンバーは合っていますが順序が違います。正解：'+correct.join(' → ');
  } else {
    ban.className='result-banner show wrong';
    document.getElementById('result-icon').textContent='✗';
    document.getElementById('result-text').textContent='不正解。正解：'+correct.join(' → ');
  }

  renderLog(ok,openOk);
  renderTheory(q,partial,openOk);
  document.getElementById('theory-panel').classList.add('show');
  updateStats();
  document.getElementById('btn-hint').style.display='none';
  const htype=ok?'quiz_ok':partial?'quiz_partial':'quiz_ng';
  saveHist({type:htype,score:q.score,throws:correct.join(' → '),correct:ok,ts:Date.now()});
}

function renderTheory(q,isPartial,isOpenOk){
  const isOpen=ST.outMode==='open';
  let h='';

  // ── セオリー(モード別) ──
  if(q.theory_open&&isOpen){
    h+=`<div class="tsec"><strong>■ セオリー [OPEN OUT]</strong><br>${q.theory_open}</div>`;
  } else if(q.theory){
    h+=`<div class="tsec"><strong>■ セオリー${isOpen?' [OPEN OUT対応]':''}</strong><br>${q.theory}</div>`;
  }

  // ── オープンアウト補足 ──
  if(isOpen){
    const last=getThrows(q).slice(-1)[0]||'';
    if(last.startsWith('D')){
      const num=last.slice(1);
      h+=`<div class="order-note"><b>🔓 OPEN OUT：</b>最後の${last}はS${num}（シングル${num}）でも上がり可能。</div>`;
    } else if(last.startsWith('S')||(!last.startsWith('T')&&!last.startsWith('D')&&last!=='Bull')){
      // シングルで終わる場合はそのまま
    }
    if(q.score<=20){
      h+=`<div class="order-note"><b>🔓 OPEN OUT：</b>残り${q.score}点→S${q.score}（シングル1本）でも上がり可能。</div>`;
    }
    if(isOpenOk&&!isPartial){
      h+=`<div class="order-note" style="color:var(--gr);border-color:var(--gd);"><b>✓ シングルアウト成功！</b>オープンアウトルール適用。</div>`;
    }
  }

  // ── 順序説明 ──
  if(isPartial&&q.order){
    h+=`<div class="order-note"><b>▲ 順序について：</b>${q.order}</div>`;
  }
  if(!isPartial&&q.order&&ST.mode==='study'){
    h+=`<div class="order-note"><b>▲ 順序の理由：</b>${q.order}</div>`;
  }

  // ── ミス時の対策 ──
  if(q.miss&&q.miss.length>2){
    const missHtml=q.miss.replace(/\n/g,'<br>');
    h+=`<div class="tsec"><strong>■ ミス時の対策</strong><div class="miss-case">${missHtml}</div></div>`;
  }

  document.getElementById('theory-content').innerHTML=h||'詳細情報なし';
}

// PWA
function makePWAIcon(size){
  const c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d');
  const S=size, cx=S/2, cy=S/2;

  // ── 背景：深いダークグリーン円 ──
  const bgGrad=ctx.createRadialGradient(cx,cy*0.8,0,cx,cy,S*0.5);
  bgGrad.addColorStop(0,'#1A2E1A');
  bgGrad.addColorStop(1,'#080E08');
  ctx.fillStyle=bgGrad;
  ctx.beginPath();ctx.arc(cx,cy,S*0.5,0,Math.PI*2);ctx.fill();

  // ── Phoenix盤面（簡略版、20セクション） ──
  const rs=S*0.44; // 盤面半径
  for(let i=0;i<20;i++){
    const a1=(i*18-9-90)*Math.PI/180;
    const a2=a1+18*Math.PI/180;
    const even=i%2===0;
    // 外シングル
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rs*0.97,a1,a2);ctx.arc(cx,cy,rs*0.82,a2,a1,true);ctx.closePath();
    ctx.fillStyle=even?'#1C100A':'#EDE0A8';ctx.fill();
    // ダブルリング
    ctx.beginPath();
    ctx.arc(cx,cy,rs,a1,a2);ctx.arc(cx,cy,rs*0.97,a2,a1,true);ctx.closePath();
    ctx.fillStyle=even?'#C0192E':'#1A6535';ctx.fill();
    // 内シングル
    ctx.beginPath();
    ctx.arc(cx,cy,rs*0.56,a1,a2);ctx.arc(cx,cy,rs*0.82,a2,a1,true);ctx.closePath();
    ctx.fillStyle=even?'#1C100A':'#EDE0A8';ctx.fill();
    // トリプルリング
    ctx.beginPath();
    ctx.arc(cx,cy,rs*0.60,a1,a2);ctx.arc(cx,cy,rs*0.56,a2,a1,true);ctx.closePath();
    ctx.fillStyle=even?'#C0192E':'#1A6535';ctx.fill();
  }
  // ワイヤー(外周)
  ctx.beginPath();ctx.arc(cx,cy,rs,0,Math.PI*2);
  ctx.strokeStyle='rgba(160,150,100,0.5)';ctx.lineWidth=S*0.008;ctx.stroke();

  // アウターブル（赤）
  ctx.beginPath();ctx.arc(cx,cy,rs*0.21,0,Math.PI*2);
  ctx.fillStyle='#C0192E';ctx.fill();
  // インナーブル（黒）
  ctx.beginPath();ctx.arc(cx,cy,rs*0.09,0,Math.PI*2);
  ctx.fillStyle='#080808';ctx.fill();
  // Bullワイヤー
  ctx.beginPath();ctx.arc(cx,cy,rs*0.21,0,Math.PI*2);
  ctx.strokeStyle='rgba(160,150,100,0.6)';ctx.lineWidth=S*0.006;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,rs*0.09,0,Math.PI*2);
  ctx.strokeStyle='rgba(160,150,100,0.6)';ctx.lineWidth=S*0.004;ctx.stroke();

  // ── ダーツ3本（Bullに刺さっている） ──
  // 各ダーツ: バレル→シャフト→フライトの構成
  // 3本を放射状に少しずらして刺さっている表現
  const dartAngles=[-22,-4,14]; // 度数（画面上方向が0）
  const dartConfigs=[
    {offX:S*0.022, offY:-S*0.010, rot:-15},
    {offX:-S*0.008, offY:-S*0.018, rot:3},
    {offX:-S*0.028, offY:-S*0.005, rot:18},
  ];

  dartConfigs.forEach((cfg,di)=>{
    ctx.save();
    // Bullに刺さっている根元位置（Bull中心からわずかにずれる）
    const tipX=cx+cfg.offX;
    const tipY=cy+cfg.offY;
    ctx.translate(tipX,tipY);
    ctx.rotate(cfg.rot*Math.PI/180);

    const u=S*0.01; // unit

    // ティップ（先端）
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(0.6*u,-6*u);
    ctx.lineTo(-0.6*u,-6*u);
    ctx.closePath();
    ctx.fillStyle='#C8C8C8';ctx.fill();

    // バレル（銀色の胴体）
    const brlGrad=ctx.createLinearGradient(-1.5*u,-6*u,1.5*u,-6*u);
    brlGrad.addColorStop(0,'#888');brlGrad.addColorStop(0.3,'#DDD');
    brlGrad.addColorStop(0.7,'#AAA');brlGrad.addColorStop(1,'#666');
    ctx.beginPath();
    ctx.roundRect(-1.5*u,-6*u,3*u,-10*u,0.5*u);
    ctx.fillStyle=brlGrad;ctx.fill();
    // バレルのローレット(刻み)
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.3*u;
    for(let k=0;k<5;k++){
      ctx.beginPath();ctx.moveTo(-1.5*u,-7*u-k*1.8*u);ctx.lineTo(1.5*u,-7*u-k*1.8*u);ctx.stroke();
    }

    // シャフト
    ctx.beginPath();
    ctx.rect(-0.6*u,-16*u,1.2*u,-8*u);
    ctx.fillStyle='#222E22';ctx.fill();

    // フライト（4枚羽、広がった形）
    const fColor=['#E8D000','#E8D000','#FF6600','#FF6600'];
    // 上2枚
    ctx.beginPath();
    ctx.moveTo(0,-24*u);
    ctx.lineTo(-4*u,-32*u);
    ctx.lineTo(-0.5*u,-24*u);
    ctx.closePath();
    ctx.fillStyle='#FFD700';ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=0.3*u;ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,-24*u);
    ctx.lineTo(4*u,-32*u);
    ctx.lineTo(0.5*u,-24*u);
    ctx.closePath();
    ctx.fillStyle='#FFC000';ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=0.3*u;ctx.stroke();

    ctx.restore();
  });

  // ── 外枠のリング（光沢） ──
  const rimGrad=ctx.createLinearGradient(0,0,S,S);
  rimGrad.addColorStop(0,'rgba(255,255,255,0.15)');
  rimGrad.addColorStop(0.5,'rgba(255,255,255,0.02)');
  rimGrad.addColorStop(1,'rgba(0,0,0,0.3)');
  ctx.beginPath();ctx.arc(cx,cy,S*0.49,0,Math.PI*2);
  ctx.strokeStyle=rimGrad;ctx.lineWidth=S*0.016;ctx.stroke();

  return c.toDataURL('image/png');
}

function setupPWA(){

  const icon512=makePWAIcon(512);
  const icon180=makePWAIcon(180); // Apple touch icon

  // ── manifest (Blob URL) ──
  const MANIFEST={
    name:'Checkout Master',
    short_name:'CheckoutMaster',
    description:'ダーツチェックアウト練習アプリ — Phoenix配色インタラクティブボード搭載',
    start_url:'./',
    scope:'./',
    display:'standalone',
    orientation:'portrait',
    background_color:'#0D1117',
    theme_color:'#0D1117',
    icons:[
      {src:icon192,sizes:'192x192',type:'image/png',purpose:'any'},
      {src:icon192,sizes:'192x192',type:'image/png',purpose:'maskable'},
      {src:icon512,sizes:'512x512',type:'image/png',purpose:'any'},
      {src:icon512,sizes:'512x512',type:'image/png',purpose:'maskable'},
    ]
  };
  const mBlob=new Blob([JSON.stringify(MANIFEST)],{type:'application/json'});
  document.getElementById('pwa-manifest').setAttribute('href',URL.createObjectURL(mBlob));

  // ── favicon & apple-touch-icon ──
  const fi=document.createElement('link');fi.rel='icon';fi.type='image/png';fi.href=makePWAIcon(64);document.head.appendChild(fi);
  const ai=document.createElement('link');ai.rel='apple-touch-icon';ai.sizes='180x180';ai.href=icon180;document.head.appendChild(ai);

  // ── Service Worker（完全オフライン対応） ──
  if('serviceWorker' in navigator){
    // SW本体をBlobで登録。HTMLを丸ごとキャッシュしオフライン再生を保証。
    const swCode=`
const CACHE='checkout-master-v1';
const ASSETS=[self.location.href.replace('/sw-blob','')];

self.addEventListener('install',e=>{
  e.waitUntil(
    caches.open(CACHE).then(cache=>{
      // ページ自体をキャッシュ
      return fetch(self.registration.scope)
        .then(r=>cache.put(self.registration.scope,r))
        .catch(()=>{});
    })
  );
  self.skipWaiting();
});

self.addEventListener('activate',e=>{
  e.waitUntil(
    caches.keys().then(keys=>
      Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
    )
  );
  self.clients.claim();
});

self.addEventListener('fetch',e=>{
  // ナビゲーションリクエストはキャッシュ優先→なければネット
  if(e.request.mode==='navigate'){
    e.respondWith(
      caches.match(self.registration.scope)
        .then(r=>r||fetch(e.request).then(nr=>{
          caches.open(CACHE).then(c=>c.put(self.registration.scope,nr.clone()));
          return nr;
        }))
        .catch(()=>caches.match(self.registration.scope))
    );
    return;
  }
  // その他リソース: stale-while-revalidate
  e.respondWith(
    caches.match(e.request).then(r=>{
      const fetchPromise=fetch(e.request).then(nr=>{
        if(nr&&nr.status===200){

let _dp=null;

});
window.addEventListener('appinstalled',()=>{
  document.getElementById('install-banner').classList.remove('show');_dp=null;
});
function pwaInstall(){
  if(_dp){
    _dp.prompt();
    _dp.userChoice.then(r=>{if(r.outcome==='accepted')_dp=null;});
  } else {
    // iOS向け手順案内
    const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    if(isIOS){
      alert('iPhoneでのインストール方法:\n\n① SafariでこのURLを開く\n② 画面下の「共有」ボタン(□↑)をタップ\n③「ホーム画面に追加」をタップ\n④「追加」をタップ\n\nアイコンがホーム画面に追加されます！');
    } else {
      alert('Androidでのインストール方法:\n\n① ChromeでこのURLを開く\n② 右上メニュー(⋮)をタップ\n③「ホーム画面に追加」または「アプリをインストール」をタップ\n\nアイコンがホーム画面に追加されます！');
    }
  }
  document.getElementById('install-banner').classList.remove('show');
}
function dismissInstall(){document.getElementById('install-banner').classList.remove('show');}
function checkIOSInstall(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isSafari=/^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  const isStandalone='standalone' in navigator&&navigator.standalone;
  if(isIOS&&isSafari&&!isStandalone){
    setTimeout(()=>{
      document.getElementById('install-banner').classList.add('show');
      document.getElementById('install-btn').textContent='追加方法';
    },2000);
  }
}
