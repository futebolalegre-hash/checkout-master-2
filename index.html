<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Master</title>
<style>
    body { background: #0D1117; color: #E8EEE8; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    .board-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #dartboard { width: 100%; max-width: 400px; }
    .bottom-panel { padding: 20px; text-align: center; }
    .btn { padding: 15px 30px; background: #00FF7F; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
    <div class="board-area">
        <svg id="dartboard" viewBox="0 0 400 400">
            <!-- テスト用の簡易円 -->
            <circle cx="200" cy="200" r="180" fill="#333" stroke="#9A9070" stroke-width="5"/>
            <circle cx="200" cy="200" r="20" fill="#B8172A"/>
            <text x="200" y="210" text-anchor="middle" fill="white">TEST</text>
        </svg>
    </div>
    <div class="bottom-panel">
        <button class="btn" onclick="alert('動作OK')">🎯 確定</button>
    </div>
</body>
</html>
